ValidateAndStore:
  name: ${self:custom.servicePrefix}-ValidateAndStore
  handler: src/validate_and_store/handler.handler
  role: !GetAtt ValidateAndStoreRole.Arn
  timeout: 25
  memorySize: 256
  package:
    patterns:
      - ../src/common/**
      - ../src/validate_and_store/**
  layers:
    - !Ref CommonsLambdaLayer
  environment:
    RAW_REPORTS_BUCKET_NAME: ${self:custom.s3.rawReportsBucket.name}
  events:
    - http:
        path: /accident-reports
        method: post
        private: true

SplitAndEnqueue:
  name: ${self:custom.servicePrefix}-SplitAndEnqueue
  handler: src/split_and_enqueue/handler.handler
  role: !GetAtt SplitAndEnqueueRole.Arn
  timeout: 60
  memorySize: 256
  package:
    patterns:
      - ../src/common/**
      - ../src/split_and_enqueue/**
  layers:
    - !Ref CommonsLambdaLayer
  environment:
    ACCIDENT_REPORTS_QUEUE_URL: ${self:custom.sqs.accidentReports.url}
  events:
    - s3:
        bucket: ${self:custom.s3.rawReportsBucket.name}
        event: s3:ObjectCreated:*
        rules:
          - prefix: uploads/
        existing: true

ValidateAndPersist:
  name: ${self:custom.servicePrefix}-ValidateAndPersist
  handler: src/validate_and_persist/handler.handler
  role: !GetAtt ValidateAndPersistRole.Arn
  timeout: 15
  memorySize: 256
  package:
    patterns:
      - ../src/common/**
      - ../src/validate_and_persist/**
  layers:
    - !Ref MongoLambdaLayer
    - !Ref SecurityLambdaLayer
  environment:
    MONGO_CREDENTIALS_SECRET_NAME: ${self:custom.secretsManager.mongoCredentials}
    PII_ENCRYPTION_KEY_SECRET_NAME: ${self:custom.secretsManager.piiEncryptionKey}
    ACCIDENT_REPORTS_DLQ_URL: ${self:custom.sqs.accidentReportsDLQ.url}
  events:
    - sqs:
        arn: ${self:custom.sqs.accidentReports.arn}
        batchSize: 1
