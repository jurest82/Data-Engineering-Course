            Statement:
              - Effect: Allow
                Action:
                  - sqs:ReceiveMessage
                  - sqs:DeleteMessage
                  - sqs:GetQueueAttributes
                Resource: ${self:custom.sqs.accidentReportsTransformer.arn}
              - Effect: Allow
                Action: sqs:SendMessage
                Resource: ${self:custom.sqs.accidentReportsTransformerDLQ.arn}
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Sub >-
                  arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${self:custom.secretsManager.rdsCredentials}-*

