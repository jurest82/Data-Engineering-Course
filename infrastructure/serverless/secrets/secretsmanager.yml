Resources:
  MongoCredentialsSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub /${self:custom.servicePrefix}/MongoCredentials
      Description: MongoDB Atlas connection credentials for the accident reports batch pipeline
      SecretString: !Sub |
        {
          "host": "${env:MONGO_HOST}",
          "username": "${env:MONGO_USERNAME}",
          "password": "${env:MONGO_PASSWORD}",
          "dbname": "${env:MONGO_DBNAME}"
        }

  PiiEncryptionKeySecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub /${self:custom.servicePrefix}/PiiEncryptionKey
      Description: Symmetric key (Fernet) used to encrypt PII accident report fields before storing them in MongoDB Atlas
      SecretString: !Sub |
        {
          "key": "${env:PII_ENCRYPTION_KEY}"
        }
