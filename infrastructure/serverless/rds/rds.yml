Resources:
  TrafficMonitoringSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allows inbound PostgreSQL access to the traffic monitoring RDS instance
      VpcId: ${env:DEFAULT_VPC_ID}
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          CidrIp: 0.0.0.0/0

  TrafficMonitoringDBSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Default VPC subnets for the traffic monitoring RDS instance
      SubnetIds: !Split [',', '${env:DEFAULT_VPC_SUBNET_IDS}']

  TrafficMonitoringMasterSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub /${self:custom.servicePrefix}/MasterCredentials
      Description: RDS master credentials for the traffic monitoring PostgreSQL instance
      GenerateSecretString:
        SecretStringTemplate: !Sub |
          {
            "username": "${self:custom.rds.masterUsername}"
          }
        GenerateStringKey: password
        ExcludeCharacters: '"''(),./:;<=>?@[\]^`{|}~%#&!'

  TrafficMonitoringDBInstance:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      DBInstanceIdentifier: ${self:custom.servicePrefix}
      Engine: postgres
      EngineVersion: '18.3'
      DBInstanceClass: db.t4g.micro
      AllocatedStorage: '20'
      StorageType: gp2
      DBName: traffic_monitoring
      Port: '5432'
      MasterUsername: ${self:custom.rds.masterUsername}
      MasterUserPassword: !Sub
        - '{{resolve:secretsmanager:${SecretId}::password}}'
        - SecretId: !Ref TrafficMonitoringMasterSecret
      DBSubnetGroupName: !Ref TrafficMonitoringDBSubnetGroup
      VPCSecurityGroups:
        - !GetAtt TrafficMonitoringSecurityGroup.GroupId
      PubliclyAccessible: true
      MultiAZ: false
      AllowMajorVersionUpgrade: false
      BackupRetentionPeriod: 1
      DeletionProtection: false

  TrafficMonitoringSecretAttachment:
    Type: AWS::SecretsManager::SecretTargetAttachment
    DependsOn:
      - TrafficMonitoringDBInstance
      - TrafficMonitoringMasterSecret
    Properties:
      SecretId: !Ref TrafficMonitoringMasterSecret
      TargetId: !Ref TrafficMonitoringDBInstance
      TargetType: AWS::RDS::DBInstance
