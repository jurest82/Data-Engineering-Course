Resources:
  AccidentReportsExtractorDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: ${self:custom.etl.accidentReports.extractor.dlqName.${self:custom.stage}}
      MessageRetentionPeriod: 1209600 # 14 days

  AccidentReportsExtractorQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: ${self:custom.etl.accidentReports.extractor.name.${self:custom.stage}}
      VisibilityTimeout: 60
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt AccidentReportsExtractorDLQ.Arn
        maxReceiveCount: ${self:custom.etl.accidentReports.extractor.maxReceiveCount}

  AccidentReportsDispatcherDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: ${self:custom.etl.accidentReports.dispatcher.dlqName.${self:custom.stage}}
      MessageRetentionPeriod: 1209600 # 14 days

  AccidentReportsDispatcherQueue:
