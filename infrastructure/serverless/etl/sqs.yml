      QueueName: ${self:custom.etl.accidentReports.dispatcher.name.${self:custom.stage}}
      VisibilityTimeout: 60
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt AccidentReportsDispatcherDLQ.Arn
        maxReceiveCount: ${self:custom.etl.accidentReports.dispatcher.maxReceiveCount}

  AccidentReportsTransformerDLQ:
