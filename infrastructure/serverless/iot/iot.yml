Resources:
  SensorReadingsPolicy:
    Type: AWS::IoT::Policy
    Properties:
      PolicyName: ${self:custom.servicePrefix}-sensor-readings-${self:custom.stage}
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action: iot:Connect
            Resource:
              !Join [
                '',
                [
                  'arn:aws:iot:',
                  !Ref AWS::Region,
                  ':',
                  !Ref AWS::AccountId,
                  ':client/${iot:Connection.Thing.ThingName}',
                ],
              ]
          - Effect: Allow
            Action: iot:Publish
            Resource:
              !Join [
                '',
                [
                  'arn:aws:iot:',
                  !Ref AWS::Region,
                  ':',
                  !Ref AWS::AccountId,
                  ':topic/sensors/traffic/${iot:Connection.Thing.ThingName}/data',
                ],
              ]

  SensorReadingsTopicRuleRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: ${self:custom.servicePrefix}-TopicRule
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: iot.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: ${self:custom.servicePrefix}-TopicRule
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: sqs:SendMessage
                Resource: ${self:custom.sqs.sensorReadings.arn}

  SensorReadingsTopicRule:
    Type: AWS::IoT::TopicRule
    Properties:
      RuleName: ${self:custom.iot.ruleName.${self:custom.stage}}
      TopicRulePayload:
        # topic(3) is the sensor-id segment of sensors/traffic/<sensor-id>/data,
        # which the SensorReadingsPolicy guarantees matches the connecting
        # certificate's ThingName (iot:Publish is scoped to that topic). Added
        # as its own field (not "sensor_id" -- AWS IoT SQL doesn't document
        # how a naming collision with SELECT * would resolve) so the Lambda
        # can use it as the reading's sensor_id -- the payload itself carries
        # no such field, precisely so there's nothing client-controlled to
        # misreport.
        Sql: "SELECT *, topic(3) AS thing_name FROM 'sensors/traffic/+/data'"
        AwsIotSqlVersion: '2016-03-23'
        RuleDisabled: false
        Actions:
          - Sqs:
              QueueUrl: ${self:custom.sqs.sensorReadings.url}
              RoleArn: !GetAtt SensorReadingsTopicRuleRole.Arn
              UseBase64: false
