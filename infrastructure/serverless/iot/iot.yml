Resources:
  SensorReadingsPolicy:
    Type: AWS::IoT::Policy
    Properties:
      PolicyName: ${self:custom.servicePrefix}-sensor-readings-${self:custom.stage}
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action: iot:Connect
            Resource:
              !Join [
                '',
                [
                  'arn:aws:iot:',
                  !Ref AWS::Region,
                  ':',
                  !Ref AWS::AccountId,
                  ':client/${iot:Connection.Thing.ThingName}',
                ],
              ]
          - Effect: Allow
            Action: iot:Publish
            Resource:
              !Join [
                '',
                [
                  'arn:aws:iot:',
                  !Ref AWS::Region,
                  ':',
                  !Ref AWS::AccountId,
                  ':topic/sensors/traffic/${iot:Connection.Thing.ThingName}/data',
                ],
              ]

  SensorReadingsTopicRuleRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: ${self:custom.servicePrefix}-TopicRule
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: iot.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: ${self:custom.servicePrefix}-TopicRule
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: sqs:SendMessage
                Resource: ${self:custom.sqs.sensorReadings.arn}

  SensorReadingsTopicRule:
    Type: AWS::IoT::TopicRule
    Properties:
      RuleName: ${self:custom.iot.ruleName.${self:custom.stage}}
      TopicRulePayload:
        Sql: "SELECT * FROM 'sensors/traffic/+/data'"
        AwsIotSqlVersion: '2016-03-23'
        RuleDisabled: false
        Actions:
          - Sqs:
              QueueUrl: ${self:custom.sqs.sensorReadings.url}
              RoleArn: !GetAtt SensorReadingsTopicRuleRole.Arn
              UseBase64: false
